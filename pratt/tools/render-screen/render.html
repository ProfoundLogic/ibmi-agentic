<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<!-- PUI_HEAD -->
</head>
<body class="BODY_CLASS" style="BODY_STYLE">
<div id="middle"></div>
<div class="WRAPPER_CLASS"><div id="richdisplay"></div></div>
<script type="text/javascript">
window.__errors = [];
window.onerror = function(m){ window.__errors.push(String(m)); };
fetch('/screen.json').then(function(r){ return r.json(); }).then(function(j){
  try {
    var c = document.getElementById('richdisplay');
    pui.runtimeContainer = c;
    j.container = c;              // pui.render() reads b.container.style
    if (!pui.V) pui.V = {};
    pui.render(j);
    window.__rendered = true;
  } catch(e) {
    window.__errors.push('render: ' + e.message + ' @@ ' + (e.stack||'').split('\n').slice(1,4).join(' | '));
  }
}).catch(function(e){ window.__errors.push('fetch: ' + e.message); });
</script>
</body></html>
