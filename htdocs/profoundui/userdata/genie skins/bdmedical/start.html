<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BD - Advancing the world of health&trade;</title>

<link rel="icon" href="/profoundui/userdata/genie skins/bdmedical/bd-logo.svg" type="image/svg+xml" />

<!-- profoundui.css MUST stay above bdmedical.css; genie.js MUST stay above the skin scripts. -->
<link href="/profoundui/proddata/css/profoundui.css" rel="stylesheet" type="text/css" />
<link href="/profoundui/userdata/genie skins/bdmedical/bdmedical.css?v=6" rel="stylesheet" type="text/css" />
<script type="text/javascript" src="/profoundui/proddata/js/genie.js"></script>
<!-- Reusable, skin-agnostic module. Loaded between genie.js and custom.js so custom.js can configure it. -->
<script type="text/javascript" src="/profoundui/userdata/genie skins/bdmedical/bd-brandkit.js?v=6"></script>
<script type="text/javascript" src="/profoundui/userdata/genie skins/bdmedical/custom.js?v=6"></script>

</head>

<body>

<div class="mainDiv">

<div class="topDiv">

  <div class="bd-header">
    <div class="bd-header__inner">
      <img class="bd-header__logo" src="/profoundui/userdata/genie skins/bdmedical/bd-logo-white.svg" alt="BD" />
      <div class="bd-header__divider"></div>
      <div class="bd-header__titles">
        <div class="bd-header__title">Enterprise Systems</div>
        <div class="bd-header__tagline">Advancing the world of health&trade;</div>
      </div>
      <div class="bd-header__meta" id="bdSessionInfo"></div>
    </div>
    <div class="bd-header__rule"></div>
  </div>

</div>

<!-- Function-key menu. Sits in its own strip directly above the terminal and
     is width-matched to it, so the button and the panel it opens are right
     next to the screen the user is working on. Chrome only: bd-brandkit.js
     fills the panel from the current screen's function keys and hides the
     toggle on screens that have none. -->
<div class="bd-screenbar">
  <button type="button" class="bd-menu-toggle" id="bdMenuToggle" hidden
          aria-haspopup="true" aria-expanded="false" aria-controls="bdMenuPanel">
    <span class="bd-menu-toggle__bars" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="bd-menu-toggle__label">Actions</span>
    <span class="bd-menu-toggle__count" id="bdMenuCount"></span>
  </button>
  <div class="bd-menu-panel" id="bdMenuPanel" role="menu" aria-labelledby="bdMenuToggle" hidden></div>
</div>

<div id="middle" class="middleDiv centered">

<div class="insideDiv" style="position:relative; visibility:hidden;" id="5250">
</div>

</div>

<div class="bottomDiv">
  <div class="bd-footer">
    <span class="bd-footer__copy">&copy; 2026 Becton, Dickinson and Company. All rights reserved.</span>
    <span class="bd-footer__links"><a href="https://www.bd.com/en-ca" target="_blank" rel="noopener">bd.com</a></span>
  </div>
</div>

</div>

</body>

</html>
